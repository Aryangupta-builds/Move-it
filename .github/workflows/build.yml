name: Build MoveIt
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin SDK 8
        shell: pwsh
        run: dotnet new globaljson --sdk-version 8.0.100 --roll-forward latestFeature --force
      - name: Publish
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Recurse -Filter MoveIt.csproj | Select-Object -First 1).FullName
          dotnet publish $proj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=true -o out
      - name: Show XAML compiler error
        if: failure()
        shell: pwsh
        run: |
          Get-ChildItem -Path . -Recurse -Filter output.json | Where-Object { $_.FullName -like '*obj*' } | ForEach-Object {
            Write-Host "=== $($_.FullName)"
            Get-Content $_.FullName
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MoveIt-Windows
          path: out
