name: Build MoveIt
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Recurse -Filter MoveIt.csproj | Select-Object -First 1).FullName
          dotnet publish $proj -c Release -r win-x64 -p:Platform=x64 -o out
      - uses: actions/upload-artifact@v4
        with:
          name: MoveIt-Windows
          path: out
