name: Build MoveIt
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin SDK 8
        shell: pwsh
        run: dotnet new globaljson --sdk-version 8.0.100 --roll-forward latestFeature --force
      - name: Publish
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Recurse -Filter MoveIt.csproj | Select-Object -First 1).FullName
          dotnet publish $proj -c Release -r win-x64 -p:Platform=x64 -p:EnableMsixTooling=true -o out
      - name: Run XAML compiler by hand
        if: failure()
        shell: pwsh
        run: |
          $exe = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk" -Recurse -Filter XamlCompiler.exe | Where-Object { $_.FullName -like '*net472*' } | Select-Object -First 1
          $inp = Get-ChildItem -Recurse -Filter input.json | Where-Object { $_.FullName -like '*obj*win-x64*' } | Select-Object -First 1
          Write-Host "exe: $($exe.FullName)"
          Write-Host "input: $($inp.FullName)"
          $out = Join-Path $inp.DirectoryName 'output2.json'
          & $exe.FullName $inp.FullName $out 2>&1 | Write-Host
          Write-Host "exit code: $LASTEXITCODE"
          if (Test-Path $out) {
            $j = Get-Content $out -Raw | ConvertFrom-Json
            $j.MSBuildLogEntries | Where-Object { $_.ErrorCode -or $_.Message -notmatch 'perfXC|Compiler Marker' } | ForEach-Object { "$($_.File)($($_.LineNumber),$($_.ColumnNumber)): $($_.ErrorCode) $($_.Message)" }
          }
      - uses: actions/upload-artifact@v4
        with:
          name: MoveIt-Windows
          path: out
