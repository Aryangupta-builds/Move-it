name: Build MoveIt
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Pin SDK 8
        shell: pwsh
        run: |
          '{ "sdk": { "version": "8.0.100", "rollForward": "latestFeature" } }' | Out-File global.json -Encoding ascii
          dotnet --version
      - name: Publish
        shell: pwsh
        run: |
          $proj = (Get-ChildItem -Recurse -Filter MoveIt.csproj | Select-Object -First 1).FullName
          dotnet publish $proj -c Release -r win-x64 -p:Platform=x64 --self-contained true -o publish -bl:msbuild.binlog
          if ($LASTEXITCODE -ne 0) {
            Write-Host '::warning::dotnet publish failed, trying Visual Studio MSBuild (has the AppxPackage / PRI tasks)'
            $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -requires Microsoft.Component.MSBuild -find 'MSBuild\**\Bin\MSBuild.exe' | Select-Object -First 1
            Write-Host "VS MSBuild: $vs"
            if (-not $vs) { exit 1 }
            & $vs $proj /restore /t:Publish /p:Configuration=Release /p:Platform=x64 /p:RuntimeIdentifier=win-x64 /p:SelfContained=true /p:PublishDir="$PWD\publish\" /bl:msbuild-vs.binlog /v:m
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Diagnose XAML compiler
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          $obj = Get-ChildItem -Recurse -Directory -Filter 'win-x64' | Where-Object { $_.FullName -like '*\obj\x64\Release\*' } | Select-Object -First 1
          Write-Host "obj dir: $($obj.FullName)"
          Get-ChildItem $obj.FullName -Filter *.json | ForEach-Object { Write-Host "== $($_.Name) ($($_.Length) bytes)" }
          $out = Join-Path $obj.FullName 'output.json'
          if (Test-Path $out) { Write-Host '== output.json (first 6000 chars)'; (Get-Content $out -Raw).Substring(0, [Math]::Min(6000, (Get-Content $out -Raw).Length)) }
          # run the compiler by hand and show exit code + all console output
          $xc = Get-ChildItem "$env:USERPROFILE\.nuget\packages\microsoft.windowsappsdk\1.6.250108002" -Recurse -Filter XamlCompiler.exe | Where-Object { $_.FullName -like '*net472*' } | Select-Object -First 1
          Write-Host "XamlCompiler: $($xc.FullName)"
          $in = Join-Path $obj.FullName 'input.json'
          $o2 = Join-Path $obj.FullName 'output_manual.json'
          $p = Start-Process -FilePath $xc.FullName -ArgumentList "`"$in`" `"$o2`"" -NoNewWindow -Wait -PassThru -RedirectStandardOutput xc_out.txt -RedirectStandardError xc_err.txt
          Write-Host "Manual XamlCompiler exit code: $($p.ExitCode)"
          Write-Host '== stdout'; Get-Content xc_out.txt -ErrorAction SilentlyContinue
          Write-Host '== stderr'; Get-Content xc_err.txt -ErrorAction SilentlyContinue
          if (Test-Path $o2) { Write-Host '== output_manual.json (first 6000 chars)'; $t = Get-Content $o2 -Raw; $t.Substring(0, [Math]::Min(6000, $t.Length)) }
          # Windows event log: crashes of XamlCompiler in the last 15 minutes
          Write-Host '== Event log (Application, last 15 min)'
          Get-WinEvent -FilterHashtable @{ LogName = 'Application'; StartTime = (Get-Date).AddMinutes(-15) } -ErrorAction SilentlyContinue |
            Where-Object { $_.ProviderName -in '.NET Runtime', 'Application Error', 'Windows Error Reporting' } |
            Select-Object -First 10 | ForEach-Object { $_.TimeCreated; $_.Message; '---' }
      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xaml-diagnostics
          path: |
            msbuild.binlog
            msbuild-vs.binlog
            xc_out.txt
            xc_err.txt
            **/obj/x64/Release/**/*.json
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: MoveIt-Portable
          path: publish/
